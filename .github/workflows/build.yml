name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g., x.y.z)
        required: false
        default: dev
      skip_tests:
        description: Skip test suite
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  AKAGI_MOCK_MODE: 0

jobs:
  test:
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/test.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: akagi-ng-${{ matrix.os }}-${{ github.event.inputs.version || 'dev' }}-${{ github.run_number }}
          path: |
            dist/release/*.exe
            dist/release/*.zip
            dist/release/*.dmg
            dist/release/*.tar.gz
            dist/release/*.AppImage
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-logs-${{ matrix.os }}-${{ github.run_number }}
          path: |
            logs/**/*.log
            dist/**/*.log
          retention-days: 7
          if-no-files-found: ignore
