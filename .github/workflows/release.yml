name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  AKAGI_MOCK_MODE: 0
  # Electron 44 supports macOS Ventura and later; keep the native engine aligned.
  MACOSX_DEPLOYMENT_TARGET: '13.0'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match package.json version $version"
            exit 1
          fi
          echo "Tag v$tag matches package.json version $version"

  pre-release-test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    needs: [validate, pre-release-test]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust_engine

      - name: Build application
        run: npm run build

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/release/*.exe
            dist/release/*.zip
            dist/release/*.dmg
            dist/release/*.tar.gz
            dist/release/*.AppImage
          retention-days: 7
          if-no-files-found: error

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failed-build-logs-${{ matrix.os }}
          path: |
            logs/**/*.log
            dist/**/*.log
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lh artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
