name: Test

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: npm run test:coverage

      - name: Run unit tests
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: npm test

      - name: Run integration tests
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: npm run test:integration

      - name: Upload coverage to Codecov
        if: ${{ startsWith(matrix.os, 'ubuntu') && success() }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: typescript
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload coverage HTML report
        if: ${{ startsWith(matrix.os, 'ubuntu') && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier format check
        run: npm run format

      - name: Run TypeScript check
        run: npm run typecheck

  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust_engine

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check the inference engine
        working-directory: packages/rust_engine
        run: cargo check --locked

      - name: Lint the inference engine
        working-directory: packages/rust_engine
        run: cargo clippy --locked --all-targets

      - name: Test the inference engine
        working-directory: packages/rust_engine
        run: |
          mkdir -p ../../coverage
          cargo llvm-cov --locked --all-targets --lcov --output-path ../../coverage/rust-lcov.info

      - name: Normalize Rust coverage paths
        run: sed -i 's#^SF:.*/packages/rust_engine/#SF:packages/rust_engine/#' coverage/rust-lcov.info

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/rust-lcov.info
          flags: rust
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
