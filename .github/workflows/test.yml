name: Test

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: npm run test:coverage

      - name: Run unit tests
        if: ${{ matrix.os != 'ubuntu-24.04' }}
        run: npm test

      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-24.04' && success() }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: typescript
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload coverage HTML report
        if: ${{ matrix.os == 'ubuntu-24.04' && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier format check
        run: npm run format

      - name: Run TypeScript check
        run: npm run typecheck

  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust_engine

      - name: Check the inference engine
        working-directory: packages/rust_engine
        run: cargo check --locked

      - name: Lint the inference engine
        working-directory: packages/rust_engine
        run: cargo clippy --locked --all-targets

      - name: Test the inference engine
        working-directory: packages/rust_engine
        run: cargo test --locked
