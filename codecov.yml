codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: 40...90

  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
        informational: false

    patch:
      default:
        target: 70%
        threshold: 5%
        if_ci_failed: error
        informational: false

flags:
  typescript:
    paths:
      - packages/main/src/
      - packages/frontend/src/
    carryforward: true

comment:
  layout: diff,flags,files,footer
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - packages/*/test/
  - packages/*/dist/
  - packages/rust_engine/
  - scripts/
  - docs/
  - dist/
  - build/
  - '**/*.d.ts'
  - '**/*.test.ts'
  - '**/*.config.*'

github_checks:
  annotations: true
