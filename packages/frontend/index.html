<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
      name="viewport"
    />
    <title>Akagi Next-Generation</title>
    <meta content="light dark" name="color-scheme" />
    <link href="torii.svg" rel="icon" />
  </head>
  <body>
    <script>
      // Runs before the bundle so the first paint has the right palette. The
      // same reading and validation lives in `lib/theme.ts` for the provider;
      // this copy cannot import it, and must stay a plain ES5 snippet.
      (function () {
        const stored = localStorage.getItem('theme');
        const theme =
          stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (theme === 'system' && systemDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
