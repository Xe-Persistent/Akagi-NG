[package]
edition = "2021"
name = "rust_engine"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "3.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The following dependencies implement the AI logic (from Akagi 3.3)
riichienv-core = "0.4.8"
candle-core = "0.9"
candle-nn = "0.9"
safetensors = "0.6"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
